# 示例：server 块内部的 location 配置片段；按实际站点调整 root/try_files。
location = /index.html {
    add_header Cache-Control "no-cache" always;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
# 注意确保部署时旧版本哈希产物保留；SPA fallback 不应错误地把缺失 JS 返回为 HTML。
